<style>
:root{--bg:#f7f2ea;--card:#fff;--ink:#2a1a10;--mute:#76624f;--pri:#c2410c;--pri2:#ffe9d6;--ok:#15803d;--warn:#b91c1c;--line:#eadbc8;--sh:0 2px 10px rgba(120,60,10,.09);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

:root[data-theme="dark"]{--bg:#17110d;--card:#241b14;--ink:#f7ecdf;--mute:#c0ad97;--pri:#fb923c;--pri2:#3a2918;--ok:#4ade80;--warn:#f87171;--line:#3a2d20;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Noto Sans Telugu","Noto Sans Devanagari",sans-serif}
body.big{font-size:20px}
body.hc{--bg:#000;--card:#000;--ink:#fff;--mute:#fff;--pri:#ffd400;--pri2:#222;--line:#fff;--sh:none}
header{background:linear-gradient(135deg,#9a3412,#ea580c 55%,#f59e0b);color:#fff;padding:22px 18px 0;position:relative}
body.hc header{background:#000;border-bottom:2px solid #fff}
header h1{margin:0;font-size:1.55em;letter-spacing:.06em}header p{margin:4px 0 0;font-size:.9em;opacity:.92;max-width:34em}
header svg{display:block;width:100%;height:34px;margin-top:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;max-width:760px;margin:0 auto;padding:10px 14px 0}
.bar select,.bar button{font:inherit;font-size:.82em;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:0;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:2px;overflow-x:auto;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 12px rgba(0,0,0,.08)}
nav button{flex:1 0 66px;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;color:var(--mute);font:inherit;font-size:.68em;padding:5px 4px;border-radius:10px;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--pri);background:var(--pri2);font-weight:700}
.ic{font-size:1.7em;line-height:1.1}
main{max-width:760px;margin:0 auto;padding:14px 14px 100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:var(--sh)}
.card h3{margin:0 0 6px}
label{display:block;font-size:.82em;font-weight:600;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button.p{background:linear-gradient(135deg,#c2410c,#ea580c);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}
body.hc button.p{background:#ffd400;color:#000}
button.s{background:var(--card);color:var(--pri);border:1.5px solid var(--pri);border-radius:12px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
.chk{display:flex;gap:8px;flex-wrap:wrap}.chk label{display:flex;gap:6px;align-items:center;margin:0;padding:8px 12px;border:1px solid var(--line);border-radius:22px;color:var(--ink);font-weight:500}
.chk input{width:auto}
.tag{display:inline-block;font-size:.72em;font-weight:600;padding:2px 9px;border-radius:10px;background:var(--pri2);color:var(--pri)}
.alert{border-left:4px solid var(--warn);background:var(--pri2);padding:9px 12px;border-radius:8px;margin:10px 0}
.ok{color:var(--ok)}.bad{color:var(--warn)}.m{color:var(--mute);font-size:.86em}
ol{list-style:none;padding:0;margin:12px 0;counter-reset:s}
ol li{counter-increment:s;position:relative;padding:0 0 14px 42px}
ol li:before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:.85em;font-weight:700}
body.hc ol li:before{color:#000}
ol li:not(:last-child):after{content:"";position:absolute;left:14px;top:32px;bottom:2px;width:2px;background:var(--line)}
.msg{padding:9px 13px;border-radius:14px;margin:8px 0;max-width:92%}
.u{background:var(--pri2);margin-left:auto}.a{background:var(--bg);border:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:0 0 14px}
.card .grid{margin:12px 0 0}
.cta{margin:0!important;padding:14px 10px!important}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;box-shadow:var(--sh);font-size:.8em;color:var(--mute)}
.stat b{display:block;font-size:1.9em;color:var(--pri);line-height:1.2}
.bars{display:flex;gap:12px;align-items:flex-end;height:130px;margin-top:12px}
.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:.74em;color:var(--mute)}
.bars i{display:block;width:100%;background:linear-gradient(var(--pri),#f59e0b);border-radius:8px 8px 0 0}
.bars em{font-style:normal;font-weight:700;color:var(--ink)}
a{color:var(--pri)}
body.front header,body.front .bar,body.front nav,body.front main{display:none}
#front{display:none}body.front #front{display:block}
.tb{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6}
.tb button{margin:0}
.lh{background:linear-gradient(135deg,#9a3412,#ea580c 55%,#f59e0b);color:#fff;padding:54px 20px 64px;text-align:center}
.lh h1{font-size:2.1em;line-height:1.15;margin:14px auto 10px;max-width:16em}.lh p{max-width:34em;margin:0 auto 22px;opacity:.95}
.lh .tag{background:rgba(255,255,255,.22);color:#fff}
.lh button.s{background:transparent;color:#fff;border-color:#fff}
.lh button.p{background:#fff;color:#9a3412;margin:0}
.wrap{max-width:900px;margin:0 auto;padding:26px 16px}
.wrap h2{text-align:center;margin:26px 0 14px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.fg .card{margin:0}.fg .ic{font-size:2em;display:block}.fg b{display:block;margin:6px 0 2px}
.au{max-width:420px;margin:30px auto;padding:22px}
footer{text-align:center;color:var(--mute);font-size:.8em;padding:20px}
